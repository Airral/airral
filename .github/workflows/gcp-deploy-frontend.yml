name: GCP · Deploy Frontends to Firebase Hosting

# Builds the Angular apps from a release tag and publishes them to Firebase
# Hosting. All four are static bundles, so there is no container and no Cloud Run
# service involved.
#
# The API base URL is written into runtime-config.js at deploy time rather than
# baked into the bundle, so the same build can be pointed at a different backend
# without rebuilding -- and so a *.web.app deploy works before DNS for
# airral.com is in place.
#
# Manual only, by design.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy (e.g. v1.0.0). Must already exist as a git tag.'
        required: true
        type: string
      apps:
        description: 'Which apps to deploy'
        required: true
        default: all
        type: choice
        options:
          - all
          - website
          - hr-portal
          - applicant-portal
          - admin-portal
      api_base_url:
        description: 'API base URL the apps should call'
        required: true
        default: 'https://api.airral.com/api'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.apps }} @ ${{ inputs.version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airral-frontend

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Confirm the ref really is a tag
        run: |
          if ! git rev-parse -q --verify 'refs/tags/${{ inputs.version }}' >/dev/null; then
            echo "::error::'${{ inputs.version }}' is not a git tag in this repository."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Resolve app list
        id: apps
        run: |
          if [ "${{ inputs.apps }}" = "all" ]; then
            echo "list=website hr-portal applicant-portal admin-portal" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ inputs.apps }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          set -euo pipefail
          for app in ${{ steps.apps.outputs.list }}; do
            echo "::group::build $app"
            yarn nx build "$app" --configuration=production
            echo "::endgroup::"
          done

      - name: Write runtime config
        # Overwrites the empty placeholder committed in each app's public/ dir.
        # Written after the build so it lands in the emitted bundle.
        run: |
          set -euo pipefail
          for app in ${{ steps.apps.outputs.list }}; do
            cat > "dist/apps/$app/browser/runtime-config.js" <<EOF
          // Generated by gcp-deploy-frontend.yml for ${{ inputs.version }}
          window.AIRRAL_RUNTIME_CONFIG = {
            apiBaseUrl: '${{ inputs.api_base_url }}',
            googleClientId: '${{ vars.GOOGLE_OAUTH_CLIENT_ID }}'
          };
          EOF
            echo "$app -> $(cat dist/apps/$app/browser/runtime-config.js | tr -d '\n')"
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # firebase-tools authenticates from GOOGLE_APPLICATION_CREDENTIALS,
          # so the credentials must exist as a file rather than only in env.
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          TARGETS=""
          for app in ${{ steps.apps.outputs.list }}; do
            TARGETS="${TARGETS}${TARGETS:+,}hosting:$app"
          done
          echo "deploying $TARGETS"
          npx --yes firebase-tools@14 deploy \
            --only "$TARGETS" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive \
            --message "${{ inputs.version }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| Apps | ${{ steps.apps.outputs.list }} |"
            echo "| API base URL | \`${{ inputs.api_base_url }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "- website · https://airral-web.web.app"
            echo "- hr-portal · https://airral-hr.web.app"
            echo "- applicant-portal · https://airral-apply.web.app"
            echo "- admin-portal · https://airral-admin.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
