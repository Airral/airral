name: GCP · Deploy API to Cloud Run

# Stage 2 of 2. Deploys an image that gcp-build-image.yml already pushed. It
# never builds, so what reaches Cloud Run is byte-for-byte what was tested, and
# rolling back is just deploying an older version that is still in the registry.
#
# Manual only, by design. Nothing here triggers on push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.0.0). Must already be in Artifact Registry.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the image exists
        # Fails here with a clear message rather than leaving Cloud Run to retry
        # pulling a tag that was never built.
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-api
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::No image tagged '${{ inputs.version }}'. Run 'GCP · Build & Push Image' first."
            exit 1
          fi

      - name: Verify the database is running
        # Without this the deploy burns five minutes failing the startup probe
        # and reports a generic container error, when the real cause is simply
        # that the scheduled power-down has the database switched off.
        run: |
          set -euo pipefail
          STATE=$(gcloud sql instances describe airral-db --format='value(state)')
          if [ "$STATE" != "RUNNABLE" ]; then
            echo "::error::Cloud SQL is $STATE. Run 'GCP · Cloud SQL Power' with action=start first."
            exit 1
          fi
          echo "database is RUNNABLE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-api
        run: |
          set -euo pipefail
          # ^@^ changes the env-var delimiter from comma to @. No value below
          # contains a comma any more, now that CORS_ALLOWED_ORIGINS is a
          # secret, but it is kept so that adding one later cannot silently
          # split a value into two variables.
          #
          # GOOGLE_OAUTH_CLIENT_ID must be the same client id the browsers use:
          # GoogleIdentityService checks it against the token's aud claim, so a
          # mismatch rejects every real sign-in. Empty is safe -- the service
          # fails closed with "Google sign-in is not configured". It is a plain
          # variable rather than a secret because a client id is public by
          # design: the browser ships it. The client *secret* would be a secret,
          # and this flow does not use one.
          #
          # CORS_ALLOWED_ORIGINS comes from Secret Manager, not because the list
          # is confidential -- anyone can discover it by sending OPTIONS with
          # different Origin headers -- but because it decides who may make
          # credentialed cross-origin calls. Keeping it there means changes are
          # versioned and audit-logged instead of arriving in a workflow commit,
          # and a new origin can be added without touching this repository.
          #
          # Only hosts we control belong in it. The four *.web.app origins were
          # dropped when Firebase Hosting was retired: a released Firebase site
          # ID can be claimed by anyone, and these are allowed with
          # allowCredentials(true), so a stale entry is a standing offer of a
          # credentialed cross-origin channel to whoever registers the name.
          gcloud run deploy airral-api \
            --image "$IMAGE:${{ inputs.version }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_API_SA }}" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --startup-probe httpGet.path=/actuator/health,initialDelaySeconds=10,periodSeconds=10,failureThreshold=30 \
            --set-env-vars "^@^SPRING_PROFILES_ACTIVE=gcp@CLOUD_SQL_INSTANCE=${{ vars.CLOUD_SQL_INSTANCE }}@DB_NAME=${{ vars.DB_NAME }}@DB_USER=${{ vars.DB_USER }}@AIRRAL_RELEASE_VERSION=${{ inputs.version }}@GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}@AIRRAL_MCP_HOSTNAME=mcp.airral.com" \
            --set-secrets "DB_PASSWORD=db-password:latest,JWT_ENCRYPTION_SECRET=jwt-encryption-secret:latest,CORS_ALLOWED_ORIGINS=cors-allowed-origins:latest"

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe airral-api \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "checking $URL/actuator/health"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health -w '%{http_code}' "$URL/actuator/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "healthy: $(cat /tmp/health)"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::Service did not report healthy. Recent logs:"
          gcloud run services logs read airral-api --region "${{ vars.GCP_REGION }}" --limit 50 || true
          exit 1

      - name: Prune old revisions
        # Cloud Run has no retention policy and keeps every revision forever.
        # Inactive revisions are not billed, so this is hygiene rather than cost
        # -- but it matters because Artifact Registry only keeps 3 image
        # versions: without this you accumulate revisions pinned to images that
        # have been deleted, which look rollback-able and are not.
        # A revision serving traffic is never deleted, whatever its age.
        run: |
          set -euo pipefail
          SVC=airral-api
          REGION="${{ vars.GCP_REGION }}"

          ACTIVE=$(gcloud run services describe "$SVC" --region "$REGION" \
            --format='value(status.traffic[].revisionName)' | tr ';,' '\n' | sed '/^$/d' | sort -u)
          echo "serving traffic: $(echo "$ACTIVE" | tr '\n' ' ')"

          gcloud run revisions list --service "$SVC" --region "$REGION" \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)' | tail -n +4 | while read -r rev; do
              [ -z "$rev" ] && continue
              if printf '%s\n' "$ACTIVE" | grep -qx "$rev"; then
                echo "  keeping $rev (serving traffic)"
                continue
              fi
              echo "  deleting $rev"
              gcloud run revisions delete "$rev" --region "$REGION" --quiet
            done
          echo "revisions remaining: $(gcloud run revisions list --service "$SVC" --region "$REGION" --format='value(metadata.name)' | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud Run deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| URL | ${{ steps.smoke.outputs.url }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
