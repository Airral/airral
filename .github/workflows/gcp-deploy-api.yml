name: GCP · Deploy API to Cloud Run

# Stage 2 of 2. Deploys an image that gcp-build-image.yml already pushed. It
# never builds, so what reaches Cloud Run is byte-for-byte what was tested, and
# rolling back is just deploying an older version that is still in the registry.
#
# Manual only, by design. Nothing here triggers on push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.0.0). Must already be in Artifact Registry.'
        required: true
        type: string

permissions:
  # contents: read was dropped because nothing here checks out the tree -- this
  # workflow only talks to gcloud about an image that already exists. Naming any
  # scope in this block makes every unnamed scope none, so what is left is a
  # token that can do exactly one thing.
  #
  # id-token: write stays, and cannot go: it is what mints the OIDC token that
  # the Workload Identity exchange trades for the deploy service account. Remove
  # it and the auth step fails.
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest
    # Anything that authenticates here becomes github-actions@, which holds
    # run.admin, iam.serviceAccountUser and secretAccessor at project level --
    # so the gate has to be on the job, not on who can click the button.
    # Naming an environment is what gives repo settings something to attach
    # required reviewers and a deployment branch policy to. On its own it
    # protects nothing: the rules have to be configured in the GitHub UI, and
    # until they are, this line only labels the deploy.
    environment: prod-api

    steps:
      - name: Authenticate to Google Cloud
        # Pinning note, true of all five gcp-*.yml workflows and recorded once
        # here rather than five times: every action is on a floating major tag.
        # actions/checkout and actions/setup-java are GitHub's own;
        # google-github-actions/auth and setup-gcloud are not, and auth is the
        # step that holds the OIDC token and writes the credentials file. A
        # moved v2 tag there runs new code as github-actions@. Pinning to a
        # commit SHA fixes that, but a wrong SHA breaks all five at once, so it
        # is an owner action with the digests resolved first -- not a rewrite to
        # be done from memory.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the image exists
        # Fails here with a clear message rather than leaving Cloud Run to retry
        # pulling a tag that was never built.
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-api
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::No image tagged '${{ inputs.version }}'. Run 'GCP · Build & Push Image' first."
            exit 1
          fi

      - name: Verify the database is running
        # Without this the deploy burns five minutes failing the startup probe
        # and reports a generic container error, when the real cause is simply
        # that the scheduled power-down has the database switched off.
        run: |
          set -euo pipefail
          STATE=$(gcloud sql instances describe airral-db --format='value(state)')
          if [ "$STATE" != "RUNNABLE" ]; then
            echo "::error::Cloud SQL is $STATE. Run 'GCP · Cloud SQL Power' with action=start first."
            exit 1
          fi
          echo "database is RUNNABLE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-api
        run: |
          set -euo pipefail
          # ^|^ sets the delimiter between variables. It has to be a character
          # that appears in none of the values, and the obvious candidates are
          # all taken: comma is in CORS origin lists, @ is in every email
          # address, and colon and slash are in URLs and the Cloud SQL instance
          # name. Getting this wrong does not fail cleanly -- @ as the delimiter
          # split AIRRAL_BOOTSTRAP_ADMIN_EMAIL=admin1@airral.com into two
          # variables and gcloud rejected the whole deploy.
          #
          # GOOGLE_OAUTH_CLIENT_ID must be the same client id the browsers use:
          # GoogleIdentityService checks it against the token's aud claim, so a
          # mismatch rejects every real sign-in. Empty is safe -- the service
          # fails closed with "Google sign-in is not configured". It is a plain
          # variable rather than a secret because a client id is public by
          # design: the browser ships it. The client *secret* would be a secret,
          # and this flow does not use one.
          #
          # CORS_ALLOWED_ORIGINS comes from Secret Manager, not because the list
          # is confidential -- anyone can discover it by sending OPTIONS with
          # different Origin headers -- but because it decides who may make
          # credentialed cross-origin calls. Keeping it there means changes are
          # versioned and audit-logged instead of arriving in a workflow commit,
          # and a new origin can be added without touching this repository.
          #
          # Only hosts we control belong in it. The four *.web.app origins were
          # dropped when Firebase Hosting was retired: a released Firebase site
          # ID can be claimed by anyone, and these are allowed with
          # allowCredentials(true), so a stale entry is a standing offer of a
          # credentialed cross-origin channel to whoever registers the name.
          #
          # max-instances is bounded by Cloud SQL, not by Cloud Run. db-f1-micro
          # has a hard 25-connection ceiling; each instance holds its own R2DBC
          # pool (application-gcp.yml: max-size 5); the four-hourly sync job runs
          # the same gcp profile from Actions and opens a pool of its own; and
          # Postgres holds 3 connections back for superusers. The budget:
          #
          #   3 x 5 instances  +  5 sync  +  3 reserved  =  23 of 25
          #
          # leaving 2 for the JDBC connection Flyway opens on every instance
          # start. 3 is therefore the ceiling, not a chosen value: 4 instances
          # would be 28 and would exhaust the database whenever a spike met a
          # sync run, which fails harder than the throttling it would replace.
          # Shrinking the pool to max-size 3 is what unlocks a real raise --
          # 5 x 3 + 3 sync + 3 reserved = 21 -- and must land before any
          # raise here does.
          #
          # min-instances 1 spares the first caller of the day the JVM and Cloud
          # SQL connector cold start they were paying in full. The idle instance
          # bills continuously at roughly $7/month, which is the same order as
          # the database it fronts: gcp-cloudsql-power.yml already halves that
          # bill by stopping Cloud SQL 20:00-08:00 ET, and the warm instance goes
          # on costing through the window where there is nothing it can serve.
          #
          # The sharper cost is a recycle inside that window. The replacement
          # does not sit out the probe waiting for 08:00 -- FlywayConfig caps its
          # connect retries at about 92 seconds on purpose, so the context aborts
          # well inside the 300s probe budget, the container exits, Cloud Run
          # starts another, and that repeats until the database is back, billed
          # at the startup CPU rate rather than the idle one.
          #
          # gcp-cloudsql-power.yml now drops the floor back to 0 before it
          # stops the database and restores it to 1 after the database is
          # RUNNABLE, so the floor tracks the power window instead of fighting
          # it. The value set here is therefore the daytime floor; overnight the
          # power job owns it, and a deploy that lands inside the off-window will
          # be corrected at the next transition rather than holding a warm
          # instance against a stopped database.
          # Résumé storage is derived from RESUME_BUCKET rather than written here,
          # and that is load bearing in both directions. --set-env-vars replaces
          # the whole environment, so anything set by hand with `gcloud run
          # services update` is wiped by the next deploy -- which is how a
          # service quietly reverts to writing résumés to the container's tmpfs
          # with nothing in the logs to say so. And naming GCS here before the
          # bucket exists is a hard down: the bean throws during context refresh
          # on a blank bucket, so the container never becomes ready.
          #
          # With the variable unset this resolves to LOCAL and an empty bucket,
          # which is exactly today's behaviour. Setting it, once the bucket and
          # its IAM binding exist, flips storage on the next deploy. Grep the
          # Cloud Run log for "Resume storage provider is GCS" to confirm it took.
          #
          # --set-secrets passes references, never values. Cloud Run resolves
          # db-password, jwt-encryption-secret and cors-allowed-origins at
          # instance start using the service's own identity (GCP_API_SA), so no
          # secret is ever fetched into this runner and there is nothing here for
          # ::add-mask:: to register. The one workflow that does read secrets into
          # a runner is gcp-sync-jobs.yml, and that one masks them. Rewriting this
          # as a shell fetch plus --set-env-vars would put both production secrets
          # in the runner's process environment, one stray echo from the log.
          #
          # All of that rationale sits above the command rather than inside it,
          # and it has to. A `#` line between two \-continued lines is not an
          # inline comment: the shell ends the command there and then tries to
          # run the remaining flags as commands. The résumé note above used to sit
          # between --startup-probe and --set-env-vars, so the deploy ran with
          # neither --set-env-vars nor --set-secrets applied and the step then
          # failed on "--set-env-vars: command not found".
          #
          # The failure is loud but it is not clean, which is the part worth
          # remembering: the truncated command is still a valid deploy, so it
          # succeeds first. gcloud run deploy without --set-env-vars is a partial
          # update that carries the previous revision's environment forward, so
          # the new image ships against the old config and only then does the
          # step exit 127. A red run here does not mean nothing was released.
          gcloud run deploy airral-api \
            --image "$IMAGE:${{ inputs.version }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_API_SA }}" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 1Gi \
            --min-instances 1 \
            --max-instances 3 \
            --timeout 300 \
            --startup-probe httpGet.path=/actuator/health,initialDelaySeconds=10,periodSeconds=10,failureThreshold=30 \
            --set-env-vars "^|^SPRING_PROFILES_ACTIVE=gcp|CLOUD_SQL_INSTANCE=${{ vars.CLOUD_SQL_INSTANCE }}|DB_NAME=${{ vars.DB_NAME }}|DB_USER=${{ vars.DB_USER }}|AIRRAL_RELEASE_VERSION=${{ inputs.version }}|GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}|AIRRAL_MCP_HOSTNAME=mcp.airral.com|AIRRAL_BOOTSTRAP_ADMIN_EMAIL=${{ vars.BOOTSTRAP_ADMIN_EMAIL }}|FILE_UPLOAD_STORAGE_PROVIDER=${{ vars.RESUME_BUCKET && 'GCS' || 'LOCAL' }}|FILE_UPLOAD_GCS_BUCKET=${{ vars.RESUME_BUCKET }}" \
            --set-secrets "DB_PASSWORD=db-password:latest,JWT_ENCRYPTION_SECRET=jwt-encryption-secret:latest,CORS_ALLOWED_ORIGINS=cors-allowed-origins:latest"

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe airral-api \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "checking $URL/actuator/health"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health -w '%{http_code}' "$URL/actuator/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "healthy: $(cat /tmp/health)"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::Service did not report healthy. Recent logs:"
          gcloud run services logs read airral-api --region "${{ vars.GCP_REGION }}" --limit 50 || true
          exit 1

      - name: Prune old revisions
        # Cloud Run has no retention policy and keeps every revision forever.
        # Inactive revisions are not billed, so this is hygiene rather than cost
        # -- but it matters because Artifact Registry only keeps 3 image
        # versions: without this you accumulate revisions pinned to images that
        # have been deleted, which look rollback-able and are not.
        # A revision serving traffic is never deleted, whatever its age.
        run: |
          set -euo pipefail
          SVC=airral-api
          REGION="${{ vars.GCP_REGION }}"

          ACTIVE=$(gcloud run services describe "$SVC" --region "$REGION" \
            --format='value(status.traffic[].revisionName)' | tr ';,' '\n' | sed '/^$/d' | sort -u)
          echo "serving traffic: $(echo "$ACTIVE" | tr '\n' ' ')"

          gcloud run revisions list --service "$SVC" --region "$REGION" \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)' | tail -n +4 | while read -r rev; do
              [ -z "$rev" ] && continue
              if printf '%s\n' "$ACTIVE" | grep -qx "$rev"; then
                echo "  keeping $rev (serving traffic)"
                continue
              fi
              echo "  deleting $rev"
              gcloud run revisions delete "$rev" --region "$REGION" --quiet
            done
          echo "revisions remaining: $(gcloud run revisions list --service "$SVC" --region "$REGION" --format='value(metadata.name)' | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud Run deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| URL | ${{ steps.smoke.outputs.url }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
