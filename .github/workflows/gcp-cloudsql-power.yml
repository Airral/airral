name: GCP · Cloud SQL Power

# Starts the POC database at 08:00 ET and stops it at 20:00 ET, and can be run
# by hand at any time. A stopped Cloud SQL instance is not billed for CPU or
# memory -- only storage -- so a 12-hour day roughly halves the compute cost,
# which is the largest line item in this project.
#
# GitHub cron is UTC only and has no DST handling. Rather than scheduling the
# two transitions, this runs hourly and asks whether the current
# America/New_York time is inside the window, then converges on that answer.
# One expression stays correct across DST, and no single run is load-bearing --
# GitHub's scheduler is best-effort and often hours late.
#
# Note: while the database is stopped the API returns errors. The website and
# the three portals are static and stay up regardless.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: start
        type: choice
        options:
          - start
          - stop
          - status
  schedule:
    # Hourly, because the job converges on the desired state rather than acting
    # at a transition. One expression is DST-correct on its own -- the window is
    # evaluated in America/New_York -- and it bounds the cost of GitHub's late
    # scheduling: a delayed run can now leave the database up for about an extra
    # hour rather than a whole night.
    - cron: '0 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  # Two starts at once would collide on the instance update operation.
  group: cloudsql-power
  cancel-in-progress: false

jobs:
  power:
    name: Cloud SQL power
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Decide the action
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION='${{ inputs.action }}'
            echo "manual run: $ACTION"
          else
            # Converge on the state the schedule wants, rather than acting only
            # at the instant of a transition.
            #
            # This previously required the ET hour to be exactly 08 or 20. That
            # never fired: GitHub's cron is best-effort and routinely runs 45
            # minutes to several hours late, by which point the hour has moved
            # on, so every scheduled run skipped and the schedule silently did
            # nothing for its entire life. Asking "should it be up right now?"
            # is delay-tolerant, idempotent, and self-healing -- a missed
            # transition is corrected by the next run instead of being lost.
            #
            # 10# forces base ten: an hour like 08 is not valid octal.
            ET_HOUR=$(TZ=America/New_York date +%H)
            ET_NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
            if [ "$((10#$ET_HOUR))" -ge 8 ] && [ "$((10#$ET_HOUR))" -lt 20 ]; then
              ACTION=start
            else
              ACTION=stop
            fi
            echo "scheduled run at $ET_NOW -> $ACTION (within 08:00-20:00 ET? $([ "$ACTION" = start ] && echo yes || echo no))"
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.decide.outputs.action != 'skip'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.decide.outputs.action != 'skip'
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply
        id: apply
        if: steps.decide.outputs.action != 'skip'
        env:
          INSTANCE: airral-db
        run: |
          set -euo pipefail
          state() {
            gcloud sql instances describe "$INSTANCE" --format='value(state)'
          }

          BEFORE=$(state)
          echo "current state: $BEFORE"

          case '${{ steps.decide.outputs.action }}' in
            start)
              if [ "$BEFORE" = "RUNNABLE" ]; then
                echo "already running, nothing to do"
              else
                gcloud sql instances patch "$INSTANCE" --activation-policy=ALWAYS --quiet
                # patch returns once the operation is accepted, not once the
                # instance is serving, so wait for it to actually be usable.
                for i in $(seq 1 30); do
                  S=$(state)
                  echo "  waiting: $S"
                  [ "$S" = "RUNNABLE" ] && break
                  sleep 10
                done
              fi
              ;;
            stop)
              if [ "$BEFORE" = "STOPPED" ]; then
                echo "already stopped, nothing to do"
              else
                gcloud sql instances patch "$INSTANCE" --activation-policy=NEVER --quiet
              fi
              ;;
            status)
              echo "status only, making no change"
              ;;
          esac

          AFTER=$(state)
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "final state: $AFTER"

          if [ '${{ steps.decide.outputs.action }}' = 'start' ] && [ "$AFTER" != "RUNNABLE" ]; then
            echo "::error::Instance did not reach RUNNABLE (state: $AFTER)."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud SQL power"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Action | \`${{ steps.decide.outputs.action }}\` |"
            echo "| State | \`${{ steps.apply.outputs.after || 'unchanged' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
