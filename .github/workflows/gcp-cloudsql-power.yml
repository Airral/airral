name: GCP · Cloud SQL Power

# Starts and stops the POC database, BY HAND ONLY. The schedule is gone.
#
# It ran every twenty minutes on paper. Measured from the run history on
# 2026-09-16, GitHub actually fired it every three to five hours: 00:59Z,
# 05:39Z, 10:16Z, then nothing until a manual run at 15:00Z. The 10:16Z run
# was 06:16 ET, outside the window, so it correctly stopped the database --
# and the run that should have started it again at 08:03 ET never happened.
# Production was down from 08:00 to 11:00 ET, in the middle of a working day,
# and nothing alerted.
#
# The converge-on-desired-state design below is right and is kept for manual
# runs. It cannot help here: a self-healing schedule still has to run to heal,
# and three firing opportunities an hour that GitHub honours once every four
# hours is not a schedule. Tuning the cron further would be tuning the wrong
# thing.
#
# So the instance stays on (activation policy ALWAYS) and the saving is given
# up deliberately. A db-f1-micro is roughly $8/month always-on against $4 at
# twelve hours a day: the schedule was buying about four dollars a month in
# exchange for multi-hour outages during business hours. A GCP-native Cloud
# Scheduler job would keep both, and is the thing to build if the bill ever
# matters more than this.
#
# Note: while the database is stopped the API returns errors -- 500 from
# GlobalExceptionHandler's catch-all, because an R2DBC failure is a
# RuntimeException. The three portals are static and stay up regardless.
#
# The website no longer is. It server-renders every job page, and each render
# is a live API call, so through this window a crawler is served a real page
# for a real posting built from a failed fetch. That page must not carry
# noindex: job-route.resolvers.ts only treats 400/404/410 as "this posting is
# gone" for exactly that reason, and anything else -- including this window's
# 500s -- renders as temporarily unavailable with the robots tag left alone.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: start
        type: choice
        options:
          - start
          - stop
          - status

permissions:
  # contents: read was dropped because nothing here checks out the tree -- the
  # job only reads the clock and calls gcloud. Naming any scope in this block
  # makes every unnamed scope none.
  #
  # id-token: write stays, and cannot go: it is what mints the OIDC token the
  # Workload Identity exchange trades for the service account.
  id-token: write

concurrency:
  # Two starts at once would collide on the instance update operation.
  group: cloudsql-power
  cancel-in-progress: false

jobs:
  power:
    name: Cloud SQL power
    runs-on: ubuntu-latest
    # This job stops and starts the production database and edits the API
    # service, so it belongs behind a gate like the deploys -- but only the
    # branch-policy kind.
    #
    # "unattended" is in the name as a warning: this runs three times an hour
    # on cron, so required reviewers must NEVER be attached to this
    # environment. A scheduled run that waits for approval does not run; the
    # database would stay in whatever state it was last left in, and the
    # pending-approval queue would grow by 72 entries a day.
    environment: prod-db-power-unattended
    timeout-minutes: 20

    steps:
      - name: Decide the action
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION='${{ inputs.action }}'
            echo "manual run: $ACTION"
          else
            # Unreachable while there is no schedule trigger, and kept for the
            # day a reliable one exists -- a Cloud Scheduler job calling this
            # by dispatch, or GitHub cron if it ever becomes dependable.
            #
            # Converge on the state the schedule wants, rather than acting only
            # at the instant of a transition.
            #
            # This previously required the ET hour to be exactly 08 or 20. That
            # never fired: GitHub's cron is best-effort and routinely runs 45
            # minutes to several hours late, by which point the hour has moved
            # on, so every scheduled run skipped and the schedule silently did
            # nothing for its entire life. Asking "should it be up right now?"
            # is delay-tolerant, idempotent, and self-healing -- a missed
            # transition is corrected by the next run instead of being lost.
            #
            # 10# forces base ten: an hour like 08 is not valid octal.
            ET_HOUR=$(TZ=America/New_York date +%H)
            ET_NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
            if [ "$((10#$ET_HOUR))" -ge 8 ] && [ "$((10#$ET_HOUR))" -lt 20 ]; then
              ACTION=start
            else
              ACTION=stop
            fi
            echo "scheduled run at $ET_NOW -> $ACTION (within 08:00-20:00 ET? $([ "$ACTION" = start ] && echo yes || echo no))"
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.decide.outputs.action != 'skip'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.decide.outputs.action != 'skip'
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply
        id: apply
        if: steps.decide.outputs.action != 'skip'
        env:
          INSTANCE: airral-db
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          state() {
            gcloud sql instances describe "$INSTANCE" --format='value(state)'
          }

          # Never fatal. The power transition is the job here; if the service is
          # missing or the API has not been deployed yet, saying so and carrying
          # on beats failing a run whose real work already succeeded.
          pin_min_instances() {
            local want="$1"
            echo "pinning airral-api min-instances to $want"
            if ! gcloud run services update airral-api \
                   --region "$REGION" --min-instances="$want" --quiet; then
              echo "::warning::Could not set min-instances=$want on airral-api."
            fi
          }

          BEFORE=$(state)
          echo "current state: $BEFORE"

          case '${{ steps.decide.outputs.action }}' in
            start)
              if [ "$BEFORE" = "RUNNABLE" ]; then
                echo "already running, nothing to do"
              else
                # --async plus an explicit wait, rather than polling on a
                # guessed timeout. The previous loop gave up after five minutes
                # and reported failure while the start carried on and succeeded
                # -- a scheduled job that cries wolf stops being a signal, and
                # tripling the run frequency would have tripled the noise.
                OP=$(gcloud sql instances patch "$INSTANCE" \
                       --activation-policy=ALWAYS --quiet --async \
                       --format='value(name)')
                echo "start operation: $OP"
                gcloud sql operations wait "$OP" --timeout=900 || true
              fi
              # Only now is it safe to keep an instance warm. The API deploy asks
              # for min-instances 1 so the first caller of the day does not pay a
              # JVM plus Cloud SQL connector start, but a warm instance is a
              # liability while the database is off: Flyway runs at startup, so a
              # replacement container retries for about 92 seconds, aborts, and
              # Cloud Run starts another -- a crash loop for the whole twelve-hour
              # window, against a service that is deliberately unavailable anyway.
              # Pinning it here, on the transition, is what makes both settings
              # safe to hold at once.
              pin_min_instances 1
              ;;
            stop)
              if [ "$BEFORE" = "STOPPED" ]; then
                echo "already stopped, nothing to do"
              else
                # Scale to zero BEFORE the database goes away, so no instance is
                # left holding a connection to an instance that is about to stop.
                pin_min_instances 0
                gcloud sql instances patch "$INSTANCE" --activation-policy=NEVER --quiet
              fi
              ;;
            status)
              echo "status only, making no change"
              ;;
          esac

          AFTER=$(state)
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "final state: $AFTER"

          if [ '${{ steps.decide.outputs.action }}' = 'start' ] && [ "$AFTER" != "RUNNABLE" ]; then
            echo "::error::Instance did not reach RUNNABLE (state: $AFTER)."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloud SQL power"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Action | \`${{ steps.decide.outputs.action }}\` |"
            echo "| State | \`${{ steps.apply.outputs.after || 'unchanged' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
