name: Backend Security Scan

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM
  push:
    branches: [ main ]
    paths:
      - 'airral-backend/**'
      - '.github/workflows/backend-security-scan.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: airral-backend

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: OSV Dependency Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        airral-backend
    permissions:
      actions: read
      contents: read
      security-events: write

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'airral-backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip Snyk when token is not configured
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN is not configured; skipping Snyk scan. OSV and Trivy security scans still run."

      - name: Run Snyk to check for vulnerabilities
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/gradle@master
        with:
          args: --severity-threshold=high --file=airral-backend/build.gradle
