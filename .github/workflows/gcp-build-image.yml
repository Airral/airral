name: GCP · Build & Push Image

# Stage 1 of 2. Builds a container from a release tag and pushes it to Artifact
# Registry. Deploying is a separate, manually run workflow given the same
# version, so a build can be promoted whenever you choose -- and rolled back by
# deploying an older tag that is already in the registry.
#
# Every service is built this way:
#   api        -> airral-backend, Spring Boot
#   website    -> apps/website, static Angular behind nginx
#   applicant  -> apps/applicant-portal
#   hr         -> apps/hr-portal
#   admin      -> apps/admin-portal
# The four frontends share one Dockerfile, parameterised by APP -- the only
# difference between their images is which dist/ directory nginx serves.
#
# Manual only, by design. Nothing here triggers on push.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v1.3.0). Must already exist as a git tag.'
        required: true
        type: string
      service:
        description: 'Which image to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - frontends
          - api
          - website
          - applicant
          - hr
          - admin

permissions:
  # contents: read is genuinely needed here -- the build job checks out the
  # release tag. It stays read: nothing in this workflow writes to the
  # repository, and the build must not be able to move the tag it is building.
  #
  # id-token: write is required to mint the OIDC token for Workload Identity,
  # so it cannot be removed from any of the five GCP workflows.
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    # Validates a string and emits a JSON list. No checkout, no gcloud, so no
    # token: without this it would inherit id-token: write and be able to mint
    # credentials for github-actions@, which can push to Artifact Registry and
    # read every secret in the project.
    permissions: {}
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - name: Validate version is usable as a container tag
        run: |
          V='${{ inputs.version }}'
          if ! printf '%s' "$V" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,126}$'; then
            echo "::error::'$V' is not a valid container image tag."
            exit 1
          fi

      - name: Pick services
        id: pick
        run: |
          case '${{ inputs.service }}' in
            all)       echo 'services=["api","website","applicant","hr","admin"]' >> "$GITHUB_OUTPUT" ;;
            frontends) echo 'services=["website","applicant","hr","admin"]' >> "$GITHUB_OUTPUT" ;;
            *)         echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build ${{ matrix.service }} ${{ inputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    # An image pushed here is what the deploy workflows later ship, so the push
    # is part of the production path even though nothing is served from it yet.
    # Naming an environment gives repo settings somewhere to attach a
    # deployment branch policy; it protects nothing until that is configured.
    #
    # Kept separate from prod-api and prod-frontend so a reviewer requirement
    # can be placed on the deploys without also gating every build.
    environment: prod-images
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve.outputs.services) }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Confirm the ref really is a tag
        # Guards against a typo silently building a branch and publishing it
        # under a version number that corresponds to no release.
        run: |
          if ! git rev-parse -q --verify 'refs/tags/${{ inputs.version }}' >/dev/null; then
            echo "::error::'${{ inputs.version }}' is not a git tag in this repository."
            exit 1
          fi
          echo "building $(git rev-parse --short HEAD) from tag ${{ inputs.version }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral
        run: |
          set -euo pipefail
          # A frontend's nx project name is not always its short name, and the
          # image name follows the short name so the registry reads cleanly.
          case '${{ matrix.service }}' in
            api)       CONTEXT=airral-backend  IMAGE="$REGISTRY/airral-api"       APP="" ;;
            website)   CONTEXT=airral-frontend IMAGE="$REGISTRY/airral-website"   APP=website ;;
            applicant) CONTEXT=airral-frontend IMAGE="$REGISTRY/airral-applicant" APP=applicant-portal ;;
            hr)        CONTEXT=airral-frontend IMAGE="$REGISTRY/airral-hr"        APP=hr-portal ;;
            admin)     CONTEXT=airral-frontend IMAGE="$REGISTRY/airral-admin"     APP=admin-portal ;;
            *) echo "::error::unknown service '${{ matrix.service }}'"; exit 1 ;;
          esac
          # Not `[ -n "$APP" ] && ...`: under `set -e` a false test is a failed
          # command, which would abort the api build, whose APP is empty.
          BUILD_ARGS=""
          if [ -n "$APP" ]; then
            BUILD_ARGS="--build-arg APP=$APP"
          fi

          SHA=$(git rev-parse --short HEAD)
          # Tagged with the version and the commit sha: the version is what you
          # deploy, the sha is what keeps the build traceable if a tag moves.
          docker build $BUILD_ARGS \
            -t "$IMAGE:${{ inputs.version }}" \
            -t "$IMAGE:sha-$SHA" \
            "$CONTEXT"
          docker push "$IMAGE:${{ inputs.version }}"
          docker push "$IMAGE:sha-$SHA"

          DIGEST=$(gcloud artifacts docker images describe \
            "$IMAGE:${{ inputs.version }}" --format='value(image_summary.digest)')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }} image pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.build.outputs.image }}:${{ inputs.version }}\` |"
            echo "| Commit | \`${{ steps.build.outputs.sha }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
