name: GCP · Sync External Jobs

# Runs the external job sync as a one-shot batch and exits.
#
# This lives in Actions rather than on Cloud Run on purpose: Cloud Run throttles
# CPU once a response is sent, so in-process background work stalls part-way, and
# keeping a always-on instance just to run a timer would cost more than the rest
# of the POC. Actions minutes are free on a public repository.
#
# It runs the same Java connectors as the application -- there is one
# implementation of the ATS integrations, not a copy reimplemented here.
#
# Each run also hard-purges postings that have been inactive past
# airral.jobs.purge-after-days, skipping any a candidate saved or ran a fit
# against.

on:
  workflow_dispatch:
    inputs:
      sweep_report:
        description: 'Report what the disappearance sweep would retire. Writes nothing.'
        required: false
        default: false
        type: boolean
  schedule:
    # Every 4 hours. GitHub's scheduler is best-effort and can drift by 10-30
    # minutes under load, which is fine for a 4-hourly refresh. Scheduled
    # workflows are disabled automatically after 60 days without repo activity.
    - cron: '0 */4 * * *'

permissions:
  # contents: read is genuinely needed -- this workflow checks out the tree and
  # builds the jar. id-token: write is what mints the OIDC token the Workload
  # Identity exchange consumes, so it cannot be removed from any of the five GCP
  # workflows without breaking authentication entirely. Everything else is left
  # unset, which GitHub reads as none: naming any scope in this block opts the
  # whole token out of the permissive default.
  contents: read
  id-token: write

concurrency:
  # The sync also takes a database lease, so a concurrent run would exit as a
  # no-op. Cancelling here just avoids burning a runner on it.
  group: external-job-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync external jobs
    runs-on: ubuntu-latest
    # This is the only job in the repository that reads Secret Manager values
    # into the runner, so it is the one that most needs a gate. Naming an
    # environment here is what gives the owner somewhere to attach a deployment
    # branch policy in repo settings; declaring it alone protects nothing.
    #
    # "unattended" is in the name as a warning: this workflow is on a 4-hourly
    # cron, so required reviewers must NEVER be attached to this environment.
    # A scheduled run that waits for approval does not run -- it queues, and the
    # sync silently stops for as long as nobody notices.
    environment: prod-sync-unattended
    timeout-minutes: 60
    defaults:
      run:
        working-directory: airral-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build sync jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Skip if the database is stopped
        id: db
        # The database is powered down outside 08:00-20:00 ET, and the 4-hourly
        # schedule overlaps that window. Exit cleanly rather than failing the
        # run every night and burying real failures in red.
        run: |
          set -euo pipefail
          STATE=$(gcloud sql instances describe airral-db --format='value(state)')
          echo "database state: $STATE"
          if [ "$STATE" != "RUNNABLE" ]; then
            echo "::notice::Database is $STATE; skipping this sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sync
        if: steps.db.outputs.skip != 'true'
        env:
          SPRING_PROFILES_ACTIVE: gcp,sync
          # Turns the sweep on in REPORT mode only. There is deliberately no input
          # here for airral.jobs.sync.sweep-dry-run, which defaults to true, so this
          # workflow cannot retire a posting however it is dispatched -- a live
          # sweep has to be a considered change to configuration, not a checkbox on
          # a manual run. Retiring is the only irreversible thing the sync does.
          AIRRAL_JOBS_SYNC_SWEEP_ENABLED: ${{ inputs.sweep_report || 'false' }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
        run: |
          set -euo pipefail
          # Pulled at run time rather than stored as a GitHub secret, so Secret
          # Manager stays the single source of truth for the password.
          #
          # Values fetched by gcloud are NOT GitHub secrets, so nothing redacts
          # them from this job's log unless we say so. ::add-mask:: is what
          # registers a value with the log scrubber, and it has to be emitted
          # between the read and the first use -- a mask registered afterwards
          # cannot retroactively redact a line already written. So each secret is
          # masked on the line immediately after the one that reads it, before
          # the export and long before the jar runs. Registration lasts for the
          # rest of the job, which is what also covers the java output teed
          # below and anything a later step echoes.
          #
          # The ::add-mask:: line embeds the value in a workflow command; GitHub
          # consumes those commands rather than printing them, so this does not
          # itself leak. Do not "simplify" it to echo the variable.
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=db-password)"
          echo "::add-mask::$DB_PASSWORD"
          JWT_ENCRYPTION_SECRET="$(gcloud secrets versions access latest --secret=jwt-encryption-secret)"
          echo "::add-mask::$JWT_ENCRYPTION_SECRET"
          export DB_PASSWORD JWT_ENCRYPTION_SECRET
          # JwtTokenProvider validates the secret at startup even though a batch
          # run issues no tokens, so it has to be present.
          # Matches the Dockerfile's setting rather than the JVM default of 25%.
          # The sync buffers whole board responses -- the largest measured is 39MB
          # before gzip -- six sources at a time, and nothing here had ever stated
          # a heap budget, so it was quietly running on a quarter of the runner.
          java -XX:MaxRAMPercentage=75.0 -jar build/libs/*.jar 2>&1 | tee /tmp/sync.log

      - name: Summary
        if: always() && steps.db.outputs.skip != 'true'
        # The grep below is a fixed allowlist of four phrases, not a tail of the
        # log, and that is deliberate: whatever the application prints, only
        # lines matching those phrases can reach the run summary. Keep it that
        # way. A summary is a file the runner uploads rather than a log line, so
        # it is the wrong place to be relying on the masker as the only defence.
        run: |
          {
            echo "### External job sync"
            echo ""
            echo '```'
            grep -E 'One-shot sync finished|sync failed|Auto-disabling|SWEEP DRY RUN' /tmp/sync.log | tail -20 || echo "no summary line found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
