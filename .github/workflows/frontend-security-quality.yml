name: Frontend Security & Quality

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 3 AM
  push:
    branches: [ main ]
    paths:
      - 'airral-frontend/**'
      - '.github/workflows/frontend-security-quality.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: airral-frontend

jobs:
  dependency-audit:
    name: OSV Dependency Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: false
      scan-args: |-
        --lockfile=airral-frontend/yarn.lock
    permissions:
      actions: read
      contents: read
      security-events: write

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip Snyk when token is not configured
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN is not configured; skipping Snyk scan. OSV dependency scanning still runs."

      - name: Run Snyk to check for vulnerabilities
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --file=airral-frontend/package.json

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [website, hr-portal]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build ${{ matrix.app }}
        run: yarn nx build ${{ matrix.app }} --configuration=production

      - name: Start ${{ matrix.app }} static server
        run: |
          yarn nx run ${{ matrix.app }}:serve-static --port=4200 > /tmp/${{ matrix.app }}-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4200 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/${{ matrix.app }}-server.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://127.0.0.1:4200
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './airral-frontend/lighthouserc.json'

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Analyze bundle sizes
        run: |
          yarn nx run-many --target=build --all --configuration=production --parallel=4

          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          for app in website hr-portal applicant-portal admin-portal; do
            size=$(du -sh dist/apps/$app | cut -f1)
            files=$(find dist/apps/$app -type f | wc -l)
            echo "### $app" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Size**: $size" >> $GITHUB_STEP_SUMMARY
            echo "- **Files**: $files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
