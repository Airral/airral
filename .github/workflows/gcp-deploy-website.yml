name: GCP · Deploy Website to Cloud Run

# Stage 2 of 2 for the marketing site. Deploys an image that gcp-build-image.yml
# already pushed; it never builds, so what ships is what was tested and rollback
# is deploying an older tag still in the registry.
#
# The service is named airral-website because the existing Cloud Run domain
# mappings for airral.com and www.airral.com already point at that name -- so
# the apex domain starts serving as soon as a revision exists, with no DNS
# change at the registrar.
#
# The API base URL is passed as an environment variable and written into
# runtime-config.js by the container entrypoint at start-up, so the same image
# can be repointed at a different backend without a rebuild.
#
# Manual only, by design.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.3.0). Must already be in Artifact Registry.'
        required: true
        type: string
      api_base_url:
        description: 'API base URL the site should call'
        required: true
        default: 'https://api.airral.com/api'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy website ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the image exists
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-website
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::No website image tagged '${{ inputs.version }}'. Run 'GCP · Build & Push Image' first."
            exit 1
          fi

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airral/airral-website
        run: |
          set -euo pipefail
          # Static nginx: far lighter than the API, and it scales to zero.
          gcloud run deploy airral-website \
            --image "$IMAGE:${{ inputs.version }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "AIRRAL_API_BASE_URL=${{ inputs.api_base_url }},GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }},AIRRAL_RELEASE_VERSION=${{ inputs.version }}"

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe airral-website \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/index -w '%{http_code}' "$URL/" || true)
            if [ "$CODE" = "200" ]; then
              echo "index.html served"
              # The entrypoint must have written the API URL in, or every page
              # would silently call the wrong backend.
              RC=$(curl -s "$URL/runtime-config.js")
              echo "$RC"
              if ! printf '%s' "$RC" | grep -qF "${{ inputs.api_base_url }}"; then
                echo "::error::runtime-config.js does not contain the expected API base URL."
                exit 1
              fi
              # SPA fallback: an unknown path must return the shell, not a 404.
              DEEP=$(curl -s -o /dev/null -w '%{http_code}' "$URL/pricing" || true)
              [ "$DEEP" = "200" ] || { echo "::error::SPA fallback broken (/pricing returned $DEEP)"; exit 1; }
              echo "SPA fallback OK"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::Website did not come up. Recent logs:"
          gcloud run services logs read airral-website --region "${{ vars.GCP_REGION }}" --limit 50 || true
          exit 1

      - name: Domain mapping status
        if: success()
        run: |
          echo "Cloud Run domain mappings pointing at this service:"
          gcloud beta run domain-mappings list --region "${{ vars.GCP_REGION }}" \
            --filter="spec.routeName=airral-website" \
            --format='table(metadata.name,status.conditions[0].status)' || true

      - name: Prune old revisions
        # Cloud Run has no retention policy and keeps every revision forever.
        # Inactive revisions are not billed, so this is hygiene rather than cost
        # -- but it matters because Artifact Registry only keeps 3 image
        # versions: without this you accumulate revisions pinned to images that
        # have been deleted, which look rollback-able and are not.
        # A revision serving traffic is never deleted, whatever its age.
        run: |
          set -euo pipefail
          SVC=airral-website
          REGION="${{ vars.GCP_REGION }}"

          ACTIVE=$(gcloud run services describe "$SVC" --region "$REGION" \
            --format='value(status.traffic[].revisionName)' | tr ';,' '\n' | sed '/^$/d' | sort -u)
          echo "serving traffic: $(echo "$ACTIVE" | tr '\n' ' ')"

          gcloud run revisions list --service "$SVC" --region "$REGION" \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)' | tail -n +4 | while read -r rev; do
              [ -z "$rev" ] && continue
              if printf '%s\n' "$ACTIVE" | grep -qx "$rev"; then
                echo "  keeping $rev (serving traffic)"
                continue
              fi
              echo "  deleting $rev"
              gcloud run revisions delete "$rev" --region "$REGION" --quiet
            done
          echo "revisions remaining: $(gcloud run revisions list --service "$SVC" --region "$REGION" --format='value(metadata.name)' | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| Cloud Run URL | ${{ steps.smoke.outputs.url }} |"
            echo "| Custom domain | https://airral.com |"
            echo "| API base URL | \`${{ inputs.api_base_url }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
