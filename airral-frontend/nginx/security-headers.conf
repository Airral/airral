# Security headers, in a file because nginx's add_header does not merge.
#
# A location block that sets any add_header of its own DISCARDS every header
# inherited from the server block. Three locations here set Cache-Control, and
# one of them is /index.html -- so declaring these once at server level would
# have silently left the application shell, the most important page to protect
# from framing, with no protection at all.
#
# Including the file in each of those locations is the only way to be sure. If
# you add a location that sets add_header, include this too.
#
# always, or nginx omits them on error responses, which is exactly when a page
# is most likely to be reflecting something it should not.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Report-only deliberately. A strict policy will break Google Identity Services
# and the Google Fonts loads before it blocks anything hostile, and finding that
# in a report beats finding it in a sign-in outage. Promote to
# Content-Security-Policy once the reports are quiet.
#
# 'unsafe-inline' for styles is required by Angular's component styles. Scripts
# do not get it, which is the half that matters.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.airral.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
