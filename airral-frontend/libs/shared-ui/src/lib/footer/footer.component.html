<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">{{ brand }}</span>
      </div>
      <p class="brand-tagline">{{ tagline }}</p>
    </div>

    <div class="footer-columns">
      <div *ngFor="let col of columns" class="footer-col">
        <h4>{{ col.title }}</h4>
        <ul>
          <li *ngFor="let link of col.links">
            <ng-container *ngIf="link.external; else internal">
              <a [href]="link.path">{{ link.label }}</a>
            </ng-container>
            <ng-template #internal>
              <a [routerLink]="link.path">{{ link.label }}</a>
            </ng-template>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; {{ year }} {{ brand }}</p>
    <p class="footer-note">Roles read from company hiring boards, refreshed through the day.</p>
  </div>
</footer>
