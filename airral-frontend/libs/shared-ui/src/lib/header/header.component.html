<header class="site-header" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="header-inner">
    <a class="brand" [routerLink]="'/'" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <span class="brand-initials">AR</span>
      </span>
      <span class="brand-text">
        <span class="brand-name">{{ brand }}</span>
        <span class="brand-tagline">{{ tagline }}</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav id="primary-nav" class="primary-nav" [class.open]="menuOpen()">
      <ul class="nav-links">
        <li *ngFor="let link of links">
          <ng-container *ngIf="link.external; else internal">
            <a [href]="link.path" (click)="closeMenu()">{{ link.label }}</a>
          </ng-container>
          <ng-template #internal>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !!link.exact }"
              (click)="closeMenu()"
            >{{ link.label }}</a>
          </ng-template>
        </li>
      </ul>

      <div class="nav-ctas">
        <ng-container *ngFor="let cta of ctas">
          <ng-container *ngIf="cta.external; else internalCta">
            <a
              [href]="cta.path"
              class="btn"
              [class.btn-primary]="cta.variant !== 'ghost'"
              [class.btn-ghost]="cta.variant === 'ghost'"
              (click)="closeMenu()"
            >{{ cta.label }}</a>
          </ng-container>
          <ng-template #internalCta>
            <a
              [routerLink]="cta.path"
              class="btn"
              [class.btn-primary]="cta.variant !== 'ghost'"
              [class.btn-ghost]="cta.variant === 'ghost'"
              (click)="closeMenu()"
            >{{ cta.label }}</a>
          </ng-template>
        </ng-container>
      </div>
    </nav>
  </div>
</header>
