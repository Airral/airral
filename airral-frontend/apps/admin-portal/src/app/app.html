<nav class="admin-nav" *ngIf="signedIn()" aria-label="Admin">
  <span class="brand"><airral-logo [size]="24" />AIRRAL <span>admin</span></span>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Launch</a>
  <a routerLink="/companies" routerLinkActive="active">Companies</a>
  <a routerLink="/users" routerLinkActive="active">Users</a>
  <a routerLink="/api-keys" routerLinkActive="active">API keys</a>
  <span class="session">
    <span class="session-email" *ngIf="signedInEmail()" [title]="signedInEmail()">{{ signedInEmail() }}</span>
    <button type="button" class="session-button" (click)="signOutEverywhere()" [disabled]="signingOutEverywhere()">
      {{ signingOutEverywhere() ? 'Signing out…' : 'Sign out everywhere' }}
    </button>
    <button type="button" class="session-button primary" (click)="signOut()">Sign out</button>
  </span>
</nav>
<p class="session-error" *ngIf="signOutError()" role="alert">{{ signOutError() }}</p>
<router-outlet></router-outlet>
