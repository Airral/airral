<div class="backdrop" aria-hidden="true"></div>

<airral-header [links]="headerLinks" [ctas]="headerCtas"></airral-header>

<main class="above">
  <section class="section container auth">
    <header class="auth__head">
      <p class="kicker">Sign in</p>
      <h1 class="h2 auth__h1">Which AIRRAL are you signing in to?</h1>
      <p class="lede auth__lede">
        Job seekers and companies have separate accounts. Pick the one that's yours.
      </p>
    </header>

    <app-audience-choice intent="sign-in" [seekerParams]="seekerParams"></app-audience-choice>
  </section>
</main>

<airral-footer></airral-footer>
