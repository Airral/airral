<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIRRAL | Job Search Workspace for Better Roles</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find fresh jobs, compare fit, check salary and company context, ask rooms, and apply with momentum in AIRRAL." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#007C6D" />
    <meta name="airral-google-client-id" content="" />
    <link rel="canonical" href="https://www.airral.com/" />
    <meta property="og:site_name" content="AIRRAL" />
    <meta property="og:title" content="AIRRAL | Job Search Workspace for Better Roles" />
    <meta
      property="og:description"
      content="Find fresh jobs, compare fit, check salary and company context, ask rooms, and apply with momentum in AIRRAL." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.airral.com/" />
    <meta property="og:image" content="https://www.airral.com/assets/brand/airral-og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIRRAL | Job Search Workspace for Better Roles" />
    <meta
      name="twitter:description"
      content="Find fresh jobs, compare fit, check salary and company context, ask rooms, and apply with momentum in AIRRAL." />
    <meta name="twitter:image" content="https://www.airral.com/assets/brand/airral-og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script type="application/ld+json" data-airral-json-ld="true">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "AIRRAL",
          "url": "https://www.airral.com",
          "logo": "https://www.airral.com/assets/brand/airral-logo.svg",
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "hello@airral.com"
            },
            {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "sales@airral.com"
            }
          ]
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "AIRRAL",
          "url": "https://www.airral.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.airral.com/jobs?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    </script>
    <script src="runtime-config.js"></script>
    <script>
      window.AIRRAL_RUNTIME_CONFIG = Object.assign(
        { apiBaseUrl: '', googleClientId: '' },
        window.AIRRAL_RUNTIME_CONFIG || {}
      );
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
