<!--
  The nav renders signed out as well as signed in.

  /jobs is public on purpose, and every job URL in the sitemap lands on it, so
  most first visits arrive with no session. This whole bar used to be behind
  *ngIf="isLoggedIn", which left those visitors on a page with no brand, no
  navigation and -- because the jobs page carries no sign-in of its own -- no
  way to reach an account at all. The gated destinations stay hidden; what a
  signed-out visitor gains is the way in.
-->
<nav class="app-nav" aria-label="Main">
  <div class="nav-left">
    <a routerLink="/jobs" class="nav-brand" aria-label="AIRRAL jobs">
      <airral-logo [size]="26" />
      <span class="brand-name">AIRRAL</span>
    </a>
    <div class="nav-links" *ngIf="isLoggedIn">
      <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" class="nav-link">
        {{ item.label }}
        <span class="nav-badge" *ngIf="item.path === '/tracker' && trackerBadge > 0">{{ trackerBadge }}</span>
      </a>
    </div>
  </div>
  <div class="nav-right">
    <ng-container *ngIf="isLoggedIn; else signedOutActions">
      <a class="nav-avatar" routerLink="/profile" title="Open profile" aria-label="Open profile">
        {{ userInitials }}
      </a>
      <button class="nav-sign-out" type="button" (click)="logout()" title="Sign out" aria-label="Sign out">
        <span class="material-icons">logout</span>
      </button>
    </ng-container>
    <ng-template #signedOutActions>
      <span class="nav-free">No account needed to browse</span>
      <a class="nav-signin" routerLink="/login">Sign in</a>
      <a class="nav-signup" routerLink="/login" [queryParams]="{ mode: 'register' }">Create account</a>
    </ng-template>
  </div>
</nav>

<main class="app-main with-nav" [class.with-tabbar]="isLoggedIn">
  <!-- Inside <main>, not between it and the nav: the nav is fixed and only
       <main> is padded for it, so anything placed above sits hidden behind it. -->
  <airral-verify-email-banner *ngIf="isLoggedIn"></airral-verify-email-banner>
  <router-outlet></router-outlet>
</main>

<!-- Phones: the same destinations as a bottom tab bar, within thumb reach. -->
<nav class="tabbar" *ngIf="isLoggedIn" aria-label="Main">
  <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" class="tab">
    <span class="material-icons" aria-hidden="true">{{ item.icon }}</span>
    <span>{{ item.label }}</span>
    <span class="tab-badge" *ngIf="item.path === '/tracker' && trackerBadge > 0">{{ trackerBadge }}</span>
  </a>
</nav>
