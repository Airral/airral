<ng-container *ngIf="!isAuthRoute; else authLayout">
	<div class="hr-shell" [class.menu-open]="menuOpen()">
	<aside class="sidebar" aria-label="Company hiring">
		<div class="brand">
			<airral-logo [size]="32" />
			<div class="brand-text">
				<p class="brand-title">{{ organizationName }}</p>
				<p class="brand-sub">{{ tierLabel }}</p>
			</div>
		</div>

		<nav class="nav-list" aria-label="Company hiring">
			<a
				*ngFor="let item of navItems"
				[routerLink]="item.path"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: item.path === '/' }"
				(click)="closeMenu()"
			>
				<span class="material-icons nav-icon" aria-hidden="true">{{ item.icon }}</span>
				<span>{{ item.label }}</span>
			</a>
		</nav>

		<div class="sidebar-foot">
			<span class="profile-pill" aria-hidden="true">{{ userInitials }}</span>
			<div class="foot-text">
				<strong>{{ userName }}</strong>
				<span>{{ roleLabel }}</span>
			</div>
			<button class="logout-btn" type="button" (click)="logout()" title="Sign out" aria-label="Sign out">
				<span class="material-icons">logout</span>
			</button>
		</div>
	</aside>

	<main class="main-content">
		<header class="topbar">
			<button class="menu-btn" type="button" (click)="toggleMenu()" title="Open navigation" aria-label="Open navigation">
				<span class="material-icons">menu</span>
			</button>
			<span class="topbar-brand">
				<airral-logo [size]="24" />
				<span>{{ organizationName }}</span>
			</span>
		</header>

		<!-- Unverified email, or a company still waiting for review: both mean this
		     employer's open jobs are not in front of candidates yet. -->
		<airral-verify-email-banner></airral-verify-email-banner>

		<section class="page-content">
			<router-outlet></router-outlet>
		</section>
	</main>
	</div>
</ng-container>

<ng-template #authLayout>
	<router-outlet></router-outlet>
</ng-template>
