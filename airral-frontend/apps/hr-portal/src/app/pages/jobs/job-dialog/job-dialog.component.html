<div class="modal-overlay" *ngIf="visible" (click)="onOverlayClick()">
  <div class="modal-dialog" (click)="onDialogClick($event)">
    <header class="modal-header">
      <div class="title-section">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
          </svg>
        </div>
        <h2>{{ editMode ? 'Edit Requisition' : 'New Requisition' }}</h2>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <div class="modal-grid">
        <label>
          <span class="label-text">Job Title <span class="required">*</span></span>
          <input [(ngModel)]="formData.title" placeholder="e.g., Senior Backend Engineer" />
        </label>
        <label>
          <span class="label-text">Department</span>
          <select [(ngModel)]="formData.departmentId">
            <option [ngValue]="null">No department</option>
            <option *ngFor="let department of departments" [ngValue]="department.id">{{ department.name }}</option>
          </select>
          <span class="label-hint" *ngIf="departments.length === 0">Add departments in Settings, Departments.</span>
        </label>
        <label>
          <span class="label-text">Hiring manager</span>
          <select [(ngModel)]="formData.hiringManagerId">
            <option [ngValue]="null">None yet</option>
            <option *ngFor="let person of hiringManagers" [ngValue]="person.id">
              {{ (person.firstName || '') + ' ' + (person.lastName || '') | slice: 0 : 60 }} ({{ person.email }})
            </option>
          </select>
          <span class="label-hint">Sees and interviews this job's candidates, and no other job's.</span>
        </label>
        <label>
          <span class="label-text">Interview kit</span>
          <select [(ngModel)]="formData.interviewKitId">
            <option [ngValue]="null">Standard criteria</option>
            <option *ngFor="let kit of interviewKits" [ngValue]="kit.id">{{ kit.name }}</option>
          </select>
          <span class="label-hint">What interviewers ask and rate. Set kits up in Settings.</span>
        </label>
        <label>
          <span class="label-text">Location</span>
          <input [(ngModel)]="formData.location" placeholder="e.g., San Francisco, CA (Remote)" />
        </label>
        <label>
          <span class="label-text">Employment Type</span>
          <select [(ngModel)]="formData.employmentType">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
        </label>
        <label>
          <span class="label-text">Salary Min ($)</span>
          <input type="number" [(ngModel)]="formData.salaryMin" placeholder="80,000" />
        </label>
        <label>
          <span class="label-text">Salary Max ($)</span>
          <input type="number" [(ngModel)]="formData.salaryMax" placeholder="120,000" />
        </label>
      </div>

      <label class="full-width">
        <span class="label-text">Job Description <span class="required">*</span></span>
        <textarea
          [(ngModel)]="formData.description"
          rows="4"
          placeholder="Describe the role, responsibilities, and what success looks like."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">Requirements</span>
        <textarea
          [(ngModel)]="formData.requirements"
          rows="3"
          placeholder="5+ years backend experience, Python/Go, microservices architecture..."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">Nice-to-Have Skills</span>
        <textarea
          [(ngModel)]="formData.niceToHave"
          rows="2"
          placeholder="Experience with Kubernetes, GraphQL, React..."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">
          ATS Keywords
          <span class="label-badge">AI Screening</span>
        </span>
        <input
          [(ngModel)]="formData.atsKeywords"
          placeholder="python, backend, microservices, api, postgresql"
        />
        <small class="hint">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4M12 8h.01" />
          </svg>
          Comma-separated keywords for automatic candidate screening
        </small>
      </label>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="saving">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
        Cancel
      </button>
      <button type="button" class="btn-outline" (click)="onSaveDraft()" [disabled]="saving">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        Save Draft
      </button>
      <button type="button" class="btn-primary" (click)="onPublish()" [disabled]="saving">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
        {{ editMode ? 'Update & Publish' : 'Publish Requisition' }}
      </button>
    </footer>
  </div>
</div>
