<div class="modal-overlay" *ngIf="visible" (click)="onOverlayClick()">
  <div class="modal-dialog" (click)="onDialogClick($event)">
    <header class="modal-header">
      <div class="title-section">
        <span class="icon-badge material-icons" aria-hidden="true">work_outline</span>
        <h2>{{ editMode ? 'Edit job' : 'New job' }}</h2>
      </div>
      <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close">
        <span class="material-icons" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="modal-body">
      <div class="modal-grid">
        <label>
          <span class="label-text">Job title <span class="required">*</span></span>
          <input [(ngModel)]="formData.title" placeholder="e.g., Senior Backend Engineer" />
        </label>
        <label>
          <span class="label-text">Department</span>
          <select [(ngModel)]="formData.departmentId">
            <option [ngValue]="null">No department</option>
            <option *ngFor="let department of departments" [ngValue]="department.id">{{ department.name }}</option>
          </select>
          <span class="label-hint" *ngIf="departments.length === 0">Add departments in Settings, Departments.</span>
        </label>
        <label>
          <span class="label-text">Hiring manager</span>
          <select [(ngModel)]="formData.hiringManagerId">
            <option [ngValue]="null">None yet</option>
            <option *ngFor="let person of hiringManagers" [ngValue]="person.id">
              {{ (person.firstName || '') + ' ' + (person.lastName || '') | slice: 0 : 60 }} ({{ person.email }})
            </option>
            <option *ngIf="formerHiringManagerId !== null" [ngValue]="formerHiringManagerId">
              {{ hiringManagerName || 'Former hiring manager' }} (no longer on the hiring team)
            </option>
          </select>
          <span class="label-hint" *ngIf="formerHiringManagerId === null">Sees and interviews this job's candidates, and no other job's.</span>
          <span class="label-hint" *ngIf="formerHiringManagerId !== null">They are no longer a manager here. Choose someone else, or None yet.</span>
        </label>
        <label>
          <span class="label-text">Interview kit</span>
          <select [(ngModel)]="formData.interviewKitId">
            <option [ngValue]="null">Standard criteria</option>
            <option *ngFor="let kit of interviewKits" [ngValue]="kit.id">{{ kit.name }}</option>
          </select>
          <span class="label-hint">What interviewers ask and rate. Set kits up in Settings.</span>
        </label>
        <label>
          <span class="label-text">Location</span>
          <input [(ngModel)]="formData.location" placeholder="e.g., San Francisco, CA (Remote)" />
        </label>
        <label>
          <span class="label-text">Employment type</span>
          <select [(ngModel)]="formData.employmentType">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
        </label>
        <label>
          <span class="label-text">Pay from ($)</span>
          <input type="number" [(ngModel)]="formData.salaryMin" placeholder="80,000" />
        </label>
        <label>
          <span class="label-text">Pay up to ($)</span>
          <input type="number" [(ngModel)]="formData.salaryMax" placeholder="120,000" />
        </label>
      </div>
      <p class="pay-note" *ngIf="!formData.salaryMin && !formData.salaryMax">
        <span class="material-icons" aria-hidden="true">payments</span>
        Add a pay range. Candidates see it first, and many skip jobs that don't show one.
      </p>

      <label class="full-width">
        <span class="label-text">What the job is <span class="required">*</span></span>
        <textarea
          [(ngModel)]="formData.description"
          rows="4"
          placeholder="Describe the role, responsibilities, and what success looks like."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">Must-haves</span>
        <span class="label-hint">What someone has to have. Candidates see these apart from the nice-to-haves, so fewer apply who don't qualify.</span>
        <textarea
          [(ngModel)]="formData.requirements"
          rows="3"
          placeholder="5+ years backend experience, Python/Go, microservices architecture..."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">Nice to have</span>
        <textarea
          [(ngModel)]="formData.niceToHave"
          rows="2"
          placeholder="Experience with Kubernetes, GraphQL, React..."
        ></textarea>
      </label>

      <label class="full-width">
        <span class="label-text">Skills to look for</span>
        <input
          [(ngModel)]="formData.atsKeywords"
          placeholder="python, backend, microservices, api, postgresql"
        />
        <small class="hint">
          Separated by commas. AIRRAL looks for them in each resume and note and shows you what it found. It is a guide for you, and never hides a candidate.
        </small>
      </label>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="saving">Cancel</button>
      <button type="button" class="btn btn-secondary" (click)="onSaveDraft()" [disabled]="saving">Save draft</button>
      <button type="button" class="btn btn-primary" (click)="onPublish()" [disabled]="saving">
        <span class="material-icons" aria-hidden="true">send</span>
        {{ editMode ? 'Save and publish' : 'Publish job' }}
      </button>
    </footer>
  </div>
</div>
