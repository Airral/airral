<app-quick-hire-home *ngIf="isHr"></app-quick-hire-home>

<section class="panel" *ngIf="!isHr">
  <h1>{{ title }}</h1>
  <p>Where your hiring work is.</p>

  <div class="cards" *ngIf="isEmployee">
    <a routerLink="/my-interviews">Your interviews and scorecards</a>
    <a routerLink="/profile">Your profile</a>
  </div>

  <div class="cards" *ngIf="isManager">
    <a routerLink="/candidates">Candidates for your jobs</a>
    <a routerLink="/interviews">Your jobs' interview schedule</a>
    <a routerLink="/my-interviews">Your interviews and scorecards</a>
    <a routerLink="/team-review">Team reviews</a>
  </div>

</section>
