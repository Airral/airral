<section class="panel">
  <h1>Settings</h1>
  <p>Your company, your team, and how you interview.</p>

  <div class="stack">
    <article *ngFor="let section of sections">
      <div>
        <h3>{{ section.title }}</h3>
        <p>{{ section.description }}</p>
      </div>
      <a class="configure" [routerLink]="section.route">Open</a>
    </article>
  </div>

  <p class="plan">Plan: {{ planName }}. To change it, email contact&#64;airral.com.</p>
</section>
