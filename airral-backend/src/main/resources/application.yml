spring:
  application:
    name: airral-backend
  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:1MB}
  webflux:
    multipart:
      max-in-memory-size: ${SPRING_MULTIPART_MAX_IN_MEMORY_SIZE:256KB}
      max-disk-usage-per-part: ${SPRING_MULTIPART_MAX_DISK_USAGE_PER_PART:5MB}
  
  # R2DBC Database Configuration (Reactive)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/airral_db
    username: ${DB_USER:HXS0302}
    password: ${DB_PASSWORD:}
    pool:
      initial-size: 15
      max-size: 30
      max-idle-time: 30m
  
  # Flyway Configuration (blocking, runs on startup)
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/airral_db
    user: ${DB_USER:HXS0302}
    password: ${DB_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Server Configuration
server:
  port: 8080
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

# Operational health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# JWT Configuration
jwt:
  encryption-secret: ${JWT_ENCRYPTION_SECRET:${JWT_SECRET:mySuperLongDefaultJwtSecretKeyForDevelopmentOnly_ChangeMe_0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ}}
  expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours in milliseconds
  issuer: ${JWT_ISSUER:airral-api}
  audience: ${JWT_AUDIENCE:airral-web}
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}

# CORS Configuration
# Development: localhost with different ports
# Production: airral.com subdomains
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.airral.com,https://app.airral.com,https://apply.airral.com,https://admin.airral.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# File Upload Configuration
file:
  upload:
    max-size: 5MB
    allowed-types: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    storage-path: ${FILE_STORAGE_PATH:${user.home}/.airral/uploads}
    store-extracted-text: ${FILE_UPLOAD_STORE_EXTRACTED_TEXT:true}

# External job source connectors
airral:
  auth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      jwk-url: ${GOOGLE_OAUTH_JWK_URL:https://www.googleapis.com/oauth2/v3/certs}
  company-logos:
    # Public Brandfetch client id for browser-rendered company logo CDN URLs.
    # Leave blank to fall back to stored company logo URLs / monograms.
    brandfetch-client-id: ${BRANDFETCH_CLIENT_ID:}
  feed:
    signals:
      gdelt:
        enabled: ${AIRRAL_FEED_GDELT_ENABLED:true}
        base-url: ${AIRRAL_FEED_GDELT_BASE_URL:https://api.gdeltproject.org}
        # Leave blank to use AIRRAL's built-in multi-query news radar:
        # funding rounds, YC-backed companies, a16z/Andreessen Horowitz, major tech-company news,
        # and trusted startup/press-release domains. Use "query one || query two" to override with multiple queries.
        default-query: ${AIRRAL_FEED_GDELT_QUERY:}
        timespan: ${AIRRAL_FEED_GDELT_TIMESPAN:30d}
        timeout-ms: ${AIRRAL_FEED_GDELT_TIMEOUT_MS:5000}
  jobs:
    country: ${AIRRAL_JOBS_COUNTRY:US}
    # Soft-expire: postings a source has not refreshed in this many days drop out of
    # search (is_active = false). Keeps the feed to genuinely fresh roles.
    retention-days: ${AIRRAL_JOBS_RETENTION_DAYS:15}
    max-age-days: ${AIRRAL_JOBS_MAX_AGE_DAYS:15}
    # Hard purge: rows inactive for this many days are physically deleted, reclaiming
    # disk. Rows a candidate saved or ran a fit against are kept regardless, because
    # candidate_saved_jobs.source_job_key has no foreign key and the applicant tracker
    # resolves job details live. The window is also a grace period: a source that
    # 404s transiently is auto-disabled and all its postings deactivated, so purging
    # on deactivation alone would drop a whole board over a blip.
    purge-after-days: ${AIRRAL_JOBS_PURGE_AFTER_DAYS:15}
    live-fallback:
      # Keep cold-cache user requests from fanning out to hundreds of ATS boards.
      # Large source sets should be served from the scheduled AIRRAL cache.
      max-sources: ${AIRRAL_JOBS_LIVE_FALLBACK_MAX_SOURCES:12}
      source-concurrency: ${AIRRAL_JOBS_LIVE_FALLBACK_SOURCE_CONCURRENCY:4}
    sync:
      enabled: ${AIRRAL_JOBS_SYNC_ENABLED:true}
      run-on-startup: ${AIRRAL_JOBS_SYNC_RUN_ON_STARTUP:true}
      fixed-delay-ms: ${AIRRAL_JOBS_SYNC_FIXED_DELAY_MS:14400000}
      initial-delay-ms: ${AIRRAL_JOBS_SYNC_INITIAL_DELAY_MS:30000}
      limit-per-source: ${AIRRAL_JOBS_SYNC_LIMIT_PER_SOURCE:500}
      lease-minutes: ${AIRRAL_JOBS_SYNC_LEASE_MINUTES:50}
      source-concurrency: ${AIRRAL_JOBS_SYNC_SOURCE_CONCURRENCY:6}
      max-sources-per-run: ${AIRRAL_JOBS_SYNC_MAX_SOURCES_PER_RUN:500}
    greenhouse:
      default-board: ${GREENHOUSE_DEFAULT_BOARD:airbnb}
      # Verified working Greenhouse public boards (last checked 2026-06-17)
      board-tokens: ${GREENHOUSE_BOARD_TOKENS:airbnb,figma,doordashusa,stripe,chime,affirm,robinhood,datadog,cloudflare,peloton,toast,instacart,andurilindustries,samsara,oscar,duolingo,coursera,discord,pinterest}
    lever:
      # Verified working Lever public sites (last checked 2026-06-17)
      site-names: ${LEVER_SITE_NAMES:matchgroup,rover,nango}
    ashby:
      # Verified working Ashby public boards (last checked 2026-06-17)
      # Many companies migrated here from Greenhouse/Lever
      board-names: ${ASHBY_BOARD_NAMES:Ashby,Linear,Notion,Ramp,Vanta,Watershed,Persona,Mercury,Braintrust,Svix,Resend,OpenAI,Zapier,Snyk,Plaid,Replit,Perplexity,Wiz,Sentry,PostHog,Pinecone,Neon,Miro,Loom,Snowflake,Temporal,Supabase,Headway,Raycast,Render,Sierra,Mintlify,Modal,MotherDuck,WorkOS,Weaviate,Synthesia,Sardine,Stytch,Unit,Podium,Prefect,Writer,Railway,TriggerDev,Pylon,Bolt,Lovable,Inngest,E2B,Vapi,Cartesia,Nango}
    smartrecruiters:
      company-identifiers: ${SMARTRECRUITERS_COMPANY_IDENTIFIERS:}
    workable:
      accounts: ${WORKABLE_ACCOUNTS:}
    workday:
      # host|tenant|site, using a slash-free host so board tokens remain route-safe.
      sources: ${WORKDAY_SOURCES:workday.wd5.myworkdayjobs.com|workday|Workday}
    bamboohr:
      company-domains: ${BAMBOOHR_COMPANY_DOMAINS:}
      api-key: ${BAMBOOHR_API_KEY:}
    jobvite:
      pages: ${JOBVITE_PAGES:}
    icims:
      pages: ${ICIMS_PAGES:}
    jazzhr:
      pages: ${JAZZHR_PAGES:}
  notifications:
    scheduler:
      enabled: ${AIRRAL_NOTIFICATIONS_SCHEDULER_ENABLED:false}
    email:
      enabled: ${AIRRAL_NOTIFICATIONS_EMAIL_ENABLED:true}
      from-address: ${AIRRAL_NOTIFICATIONS_FROM_ADDRESS:notifications@airral.com}
      from-name: ${AIRRAL_NOTIFICATIONS_FROM_NAME:AIRRAL}
      app-base-url: ${AIRRAL_NOTIFICATIONS_APP_BASE_URL:https://apply.airral.com}
    job-alert:
      cron: ${AIRRAL_NOTIFICATIONS_JOB_ALERT_CRON:0 0 9 * * *}
    follow-up:
      cron: ${AIRRAL_NOTIFICATIONS_FOLLOW_UP_CRON:0 0 10 * * *}
    weekly-digest:
      cron: ${AIRRAL_NOTIFICATIONS_WEEKLY_DIGEST_CRON:0 0 19 * * SUN}
    resume-nudge:
      cron: ${AIRRAL_NOTIFICATIONS_RESUME_NUDGE_CRON:0 0 11 * * *}

# Logging
logging:
  level:
    root: INFO
    com.airral: INFO
    org.springframework.security: INFO
    io.r2dbc.postgresql.QUERY: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    operationsSorter: method
