plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.airral'
version = '1.0.0'

// Pin the JDK for every environment (local, CI, Docker) without hardcoding a
// machine-specific path. Matches the temurin-21 runtime image.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Reactive Starters
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // R2DBC Database Drivers
    // Highest 1.0.x, which is what cloud-sql-connector 1.25.0 targets. Do not
    // move to 1.1.x without also moving Spring Boot: 1.1.x needs Netty 4.2.
    implementation 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'
    
    // Cloud SQL connectors. The app talks to Postgres over two paths -- R2DBC for
    // the app and JDBC for Flyway -- and these give both an identical connection
    // string that works from Cloud Run and from GitHub Actions. Auth is IAM plus
    // an ephemeral client certificate, so the instance needs no authorized
    // networks and no address has to be allowlisted.
    // Pinned to 1.25.x, NOT the latest. 1.26+ calls
    // PostgresqlConnectionFactoryProvider.SSL_NEGOTIATION, which only exists in
    // r2dbc-postgresql 1.1.x -- and 1.1.x is built against Netty 4.2, while
    // Spring Boot 3.2.5 manages Netty 4.1.109 for reactor-netty. Taking the
    // newest connector therefore forces a Netty major bump across WebFlux.
    // 1.25.0 targets r2dbc-postgresql 1.0.7 and keeps the whole stack on 4.1.
    implementation 'com.google.cloud.sql:cloud-sql-connector-r2dbc-postgres:1.25.0'
    implementation 'com.google.cloud.sql:postgres-socket-factory:1.25.0'

    // Resume storage on Google Cloud Storage, over the GCS HTTP/JSON API.
    //
    // Deliberately NOT com.google.cloud:google-cloud-storage. Its flattened pom drags about
    // sixty artifacts in, among them gRPC 1.67, protobuf 3.25.5 and OpenTelemetry 1.42.1, and
    // two of those land badly here. Spring Boot 3.2.5 imports opentelemetry-bom 1.31.0, and
    // io.spring.dependency-management lets a managed version beat a transitive one, so the
    // OpenTelemetry that client is compiled against gets silently downgraded while its
    // unmanaged opentelemetry-api-incubator:1.42.1-alpha stays at 1.42 -- a split that only
    // shows up at runtime. That is the same class of breakage the connector pin above exists
    // to avoid, and it is not visible without running the app.
    //
    // google-api-services-storage is the JSON API client for the same service. Its only
    // dependency is google-api-client, which jdbc-socket-factory-core (via the connector
    // above) already puts on the classpath at 2.7.2 -- higher than the 2.7.0 asked for here,
    // so nothing moves -- and which brings google-http-client, google-auth-library-oauth2-http
    // and google-oauth-client with it. Net effect on the graph: one new jar, no version
    // changes anywhere. No gRPC, no protobuf, no Netty, so r2dbc-postgresql 1.0.7 and
    // Netty 4.1.109 are untouched.
    implementation 'com.google.apis:google-api-services-storage:v1-rev20240924-2.0.0'

    // Flyway for migrations (blocking, runs on startup)
    implementation 'org.flywaydb:flyway-core:10.13.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.13.0'
    implementation 'org.springframework:spring-jdbc'

    // JWT & Security
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Password Encoding
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-core'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // MapStruct for DTO mapping
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'

    // Resume Parsing
    implementation 'org.apache.pdfbox:pdfbox:3.0.2'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Reactor Extensions
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.addons:reactor-extra'

    // Logging
    implementation 'org.springframework.boot:spring-boot-starter-logging'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.airral.AirralApplication'
}
